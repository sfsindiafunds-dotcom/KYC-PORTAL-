name: KYC portal checks

on:
  push:
    branches:
      - kyc-recovery-fix
  pull_request:
    branches:
      - kyc-recovery-fix

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: TypeScript check
        run: npm run lint
      - name: Production build
        run: npm run build
