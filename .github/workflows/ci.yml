name: KYC portal checks

on:
  push:
    branches:
      - kyc-recovery-fix
  pull_request:
    branches:
      - kyc-recovery-fix

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: TypeScript check
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Validate Firebase configuration and rules files
        run: |
          node -e "const c=require('./firebase-applet-config.json'); for (const k of ['projectId','appId','apiKey','authDomain','storageBucket','firestoreDatabaseId']) if (!c[k]) throw new Error('Missing Firebase config field: '+k)"
          test -s firestore.rules
          test -s storage.rules
      - name: Package importable project ZIP
        run: |
          zip -r kyc-portal-google-ai-studio.zip . \
            -x '.git/*' 'node_modules/*' 'dist/*' 'coverage/*' \
               '.env' '.env.*' '!.env.example' '.firebase/*' \
               'service-account*.json' '*-firebase-adminsdk-*.json' \
               '*.pem' '*.key' 'kyc.zip' '*.kyc.zip' 'private-kyc/*'
      - name: Upload project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kyc-portal-google-ai-studio
          path: kyc-portal-google-ai-studio.zip
          if-no-files-found: error
          retention-days: 14
